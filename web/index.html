  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Synkron",
    "alternateName": "Synkron Agenda",
    "description": "Système de réservation en ligne simple et professionnel pour les indépendants. Configuration en 2 minutes, notifications automatiques, anti-collision des créneaux.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": [
      {
        "@type": "Offer",
        "name": "Plan Gratuit",
        "price": "0",
        "priceCurrency": "EUR",
        "availability": "https://schema.org/InStock",
        "description": "Plan gratuit avec 10 réservations par mois"
      },
      {
        "@type": "Offer",
        "name": "Plan Pro",
        "price": "9.00",
        "priceCurrency": "EUR",
        "availability": "https://schema.org/InStock",
        "priceValidUntil": "2026-12-31",
        "description": "Plan Pro avec réservations illimitées"
      }
    ]
  }
  </script>


  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Synkron",
    "foundingDate": "2025"
  }
  </script>


  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "C'est vraiment si rapide à mettre en place ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "5 à 10 minutes, chrono. Créez votre compte, ajoutez un service (ex: 'Consultation 1h'), bloquez les créneaux où vous ne travaillez pas, partagez votre lien. Terminé. Vous pouvez peaufiner plus tard, mais dès maintenant vos clients peuvent réserver."
        }
      },
      {
        "@type": "Question",
        "name": "Comment vous garantissez qu'il n'y ait pas de double réservation ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Techniquement impossible. Dès qu'un client clique sur 'Réserver', le créneau disparaît pour tout le monde en temps réel. Même si 10 personnes consultent votre page au même moment, seule la première qui valide obtient le créneau."
        }
      },
      {
        "@type": "Question",
        "name": "Mes clients vont devoir créer un compte ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Non. Zéro inscription. Ils cliquent sur votre lien, choisissent un créneau, entrent leur nom et email, c'est réservé. Pas de mot de passe à retenir, pas de confirmation d'email à cliquer."
        }
      },
      {
        "@type": "Question",
        "name": "Qu'est-ce que vous faites de mes données ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Rien. Vos données et celles de vos clients sont chiffrées, hébergées en Europe (RGPD), et ne servent qu'à faire fonctionner votre agenda. On ne les revend jamais, on ne fait pas de pub ciblée avec, on n'envoie pas de newsletter non sollicitée."
        }
      }
    ]
  }
  </script>

<body class="flex flex-col min-h-screen bg-neutral-50">
